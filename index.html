#controls button,

let moveUp=false;

let moveLeft=false;
let moveRight=false;

function bindButton(id,key){

    const btn=document.getElementById(id);

    function set(v){
        switch(key){
            case "up": moveUp=v; break;
            case "down": moveDown=v; break;
            case "left": moveLeft=v; break;
            case "right": moveRight=v; break;
        }
    }

    btn.onpointerdown=()=>set(true);

    btn.onpointerup=
    btn.onpointerleave=
    btn.onpointercancel=()=>set(false);

}

bindButton("up","up");

// =====================================================
// PC KEYBOARD CONTROLS
// WASD / ARROW = MOVE
// X = SKILL
// Z = NEXT DIALOGUE
// =====================================================

document.addEventListener("keydown",e=>{

    // Chặn trình duyệt cuộn trang bằng phím
    if([
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        " ",
        "w","a","s","d",
        "W","A","S","D",
        "x","X",
        "z","Z"
    ].includes(e.key)){
        e.preventDefault();
    }

    // =========================
    // NEXT DIALOGUE - Z
    // =========================
    if(e.key==="z" || e.key==="Z"){

        if(dialogueActive){
            nextDialogue();
        }

        return;
    }

    // =========================
    // SKILL - X
    // =========================
    if(e.key==="x" || e.key==="X"){

        if(dialogueActive) return;
        if(skillCooldown>0) return;

        activateSkill();

        return;
    }

    // =========================
    // MOVE
    // =========================
    if(e.key==="w" || e.key==="W" || e.key==="ArrowUp"){
        moveUp=true;
    }

    if(e.key==="s" || e.key==="S" || e.key==="ArrowDown"){
        moveDown=true;
    }

    if(e.key==="a" || e.key==="A" || e.key==="ArrowLeft"){
        moveLeft=true;
    }

    if(e.key==="d" || e.key==="D" || e.key==="ArrowRight"){
        moveRight=true;
    }

});


document.addEventListener("keyup",e=>{

    if(e.key==="w" || e.key==="W" || e.key==="ArrowUp"){
        moveUp=false;
    }

    if(e.key==="s" || e.key==="S" || e.key==="ArrowDown"){
        moveDown=false;
    }

    if(e.key==="a" || e.key==="A" || e.key==="ArrowLeft"){
        moveLeft=false;
    }

    if(e.key==="d" || e.key==="D" || e.key==="ArrowRight"){
        moveRight=false;
    }

});

// =====================================================
// GET DIALOGUE FOR CURRENT PLAYABLE
// =====================================================

function getBossDialogue(stage,type){

    const data=bossDialogues[stage];

    if(!data)
        return [];

    // Stage 6 special clear dialogue
    if(type==="clear3"){
        return data.clear3 || [];
    }

    if(type==="clearLess"){
        return data.clearLess || [];
    }

    const section=data[type];

    if(!section)
        return [];

    const currentPlayable=getPlayableName();

    // Có thoại riêng cho playable hiện tại
    if(section[currentPlayable])
        return section[currentPlayable];

    // Fallback
    if(section.Renka)
        return section.Renka;

    if(section.Merivelle)
        return section.Merivelle;

    const keys=Object.keys(section);

    if(keys.length>0)
        return section[keys[0]];

    return [];
}


// =====================================================
// START DIALOGUE
// =====================================================

function startBossDialogue(stage,type){

    const lines=getBossDialogue(stage,type);

    if(!lines || lines.length===0)
        return;

    dialogueLines=lines;
    dialogueIndex=0;
    dialogueTimer=0;
    dialogueType=type;
    dialogueActive=true;
}

else if(playableName==="Tsukina"){

// =================================
// KALEYA - CLONE + CÂY NĂNG LƯỢNG
// =================================
else if(playableName==="Kaleya"){

    ctx.save();

    // =================================
    // VỊ TRÍ CLONE
    // =================================

    let cloneX=
        player.x<canvas.width/2
        ?player.x+70
        :player.x-70;

    let cloneY=player.y;


    // =================================
    // CLONE
    // =================================

    ctx.globalAlpha=0.65;

    ctx.drawImage(
        playableImg,
        cloneX-16,
        cloneY-16,
        32,
        32
    );


    // =================================
    // HÀM VẼ CÂY NĂNG LƯỢNG
    // =================================

    function drawEnergyTree(x,y){

        let grow=
            Math.min(
                1,
                (120-skillTimer)/60
            );

        let height=
            30+
            grow*170;

        let sway=
            Math.sin(frame*0.08)*8;


        // -----------------------------
        // AURA
        // -----------------------------

        ctx.globalAlpha=0.22;

        ctx.strokeStyle="#55ff88";
        ctx.lineWidth=8;

        ctx.beginPath();

        ctx.arc(
            x,
            y-height*0.45,
            35+grow*25,
            0,
            Math.PI*2
        );

        ctx.stroke();


        // -----------------------------
        // THÂN CÂY
        // -----------------------------

        ctx.globalAlpha=0.9;

        ctx.strokeStyle="#66ff99";
        ctx.lineWidth=6;

        ctx.beginPath();

        ctx.moveTo(
            x,
            y+8
        );

        ctx.quadraticCurveTo(
            x+sway,
            y-height*0.45,
            x-sway,
            y-height
        );

        ctx.stroke();


        // -----------------------------
        // CÀNH LỚN
        // -----------------------------

        for(let i=0;i<6;i++){

            let side=
                i%2===0
                ?-1
                :1;

            let yy=
                y-height*(0.25+i*0.11);

            let len=
                25+
                grow*35;

            ctx.strokeStyle="#66ff99";
            ctx.lineWidth=4;

            ctx.beginPath();

            ctx.moveTo(
                x,
                yy
            );

            ctx.quadraticCurveTo(
                x+side*15,
                yy-15,
                x+side*len,
                yy-35
            );

            ctx.stroke();


            // -------------------------
            // LÁ NĂNG LƯỢNG
            // -------------------------

            ctx.fillStyle="#9affb8";

            for(let j=0;j<3;j++){

                let lx=
                    x+
                    side*
                    (
                        len*(j+1)/4
                    );

                let ly=
                    yy-
                    35*(j+1)/3;

                ctx.beginPath();

                ctx.ellipse(
                    lx,
                    ly,
                    9,
                    5,
                    side*0.5,
                    0,
                    Math.PI*2
                );

                ctx.fill();
            }

        }


        // -----------------------------
        // NĂNG LƯỢNG BAY RA
        // -----------------------------

        for(let i=0;i<10;i++){

            let a=
                frame*0.04+
                i*Math.PI*2/10;

            let r=
                20+
                (
                    (frame*2+i*23)%80
                );

            let px=
                x+
                Math.cos(a)*r;

            let py=
                y-height*0.55+
                Math.sin(a)*r*0.5;

            ctx.globalAlpha=0.7;

            ctx.fillStyle="#aaffc0";

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                2,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    // =================================
    // CÂY CỦA PLAYER
    // =================================

    drawEnergyTree(
        player.x,
        player.y
    );


    // =================================
    // CÂY CỦA CLONE
    // =================================

    drawEnergyTree(
        cloneX,
        cloneY
    );


    // =================================
    // ĐƯỜNG NĂNG LƯỢNG NỐI 2 BÊN
    // =================================

    ctx.globalAlpha=0.5;

    ctx.strokeStyle="#77ffaa";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y
    );

    ctx.lineTo(
        cloneX,
        cloneY
    );

    ctx.stroke();


    ctx.restore();
}

        ctx.fillRect(0,0,canvas.width,canvas.height);
