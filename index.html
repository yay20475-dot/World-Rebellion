<html lang="en">
<head>
<meta charset="UTF-8">

<title>World Rebellion</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

body{
    background:#000;
    overflow:hidden;
    font-family:monospace;
}

canvas{
    display:block;
    margin:auto;
    background:#000;
    image-rendering:pixelated;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#hud{
    position:absolute;
    left:8px;
    top:8px;
    color:#fff;
    font-size:16px;
    line-height:20px;
}

#menu{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
    z-index:1000;
}

#menu h1{
    color:white;
    font-size:34px;
    margin-bottom:30px;
}

#menu button{
    width:220px;
    height:52px;
    font-size:22px;
    border:2px solid #888;
    background:#222;
    color:white;
}

#menu button:disabled{
    background:#111;
    color:#666;
    border-color:#444;
}

.chapter.active{
    border-color:#0ff;
    color:#0ff;
}
#chapterSelect{
    display:flex;
    flex-direction:column;
    gap:18px;
}
#characterSelect{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.character{
    width:220px;
    height:42px;
    font-size:18px;
}

.character.active{
    border-color:#0ff;
    color:#0ff;
}

.character:disabled{
    background:#111;
    color:#555;
    border-color:#333;
}
#characterList{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
}

#characterList .character{
    display:block;
    width:200px;
    margin:5px auto;
}
#controls{
    position:fixed;
    left:12px;
    bottom:12px;
    width:180px;
    height:180px;
    pointer-events:auto;
}

#controls button,
#skill{
    position:absolute;
    width:56px;
    height:56px;
    font-size:22px;
    border:2px solid #888;
    background:#222;
    color:#fff;
    cursor:pointer;
    opacity:0.45;
}
#skillCd{
    position:fixed;
    right:18px;
    bottom:125px;
    width:90px;
    text-align:center;
    color:#0ff;
    font-size:14px;
    font-weight:bold;
    text-shadow:0 0 4px #000;
    pointer-events:none;
}
#up{
    left:62px;
    top:0;
}

#left{
    left:0;
    top:62px;
}

#right{
    left:124px;
    top:62px;
}

#down{
    left:62px;
    top:124px;
}

#skill{
    position:fixed;
    right:18px;
    bottom:28px;
    width:90px;
    height:90px;
    font-size:18px;
    pointer-events:auto;
}

button:active{
    transform:translateY(2px);
}

</style>

</head>

                    i*Math.PI*2/10;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(a)*1.3,
                    vy:Math.sin(a)*1.3,

                    r:5

                });

            }

        }

        if(frame%24===0){

            let spin=-frame*0.035;

            for(let i=0;i<10;i++){

                let a=
                    spin+
                    i*Math.PI*2/10+
                    Math.PI/10;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(a)*2,
                    vy:Math.sin(a)*2,

                    r:3

                });

            }

        }

        for(let b of enemyBullets){

            let speed=Math.hypot(b.vx,b.vy);

            if(speed<6){

                b.vx*=1.025;
                b.vy*=1.025;

            }

        }

    }


    // =================================================
    // PATTERN 11 - PURE WAVE
    // WAVE DÀY
    // =================================================

    else if(cycle<3300){

        if(frame%5===0){

            let y=
                170+
                Math.sin(frame*0.065)*150;

            for(let i=0;i<3;i++){

                enemyBullets.push({

                    x:
                        boss.x+i*12,

                    y:
                        y+
                        i*25,

                    vx:-4.8-i*0.25,
                    vy:
                        Math.sin(frame*0.04+i)*0.7,

                    r:4

                });

            }

        }

        // Wave từ bên phải
        if(frame%10===0){

            let y=
                280+
                Math.sin(frame*0.05+2)*120;

            enemyBullets.push({

                x:canvas.width+10,
                y:y,

                vx:-3.8,
                vy:0,

                r:3

            });

        }

    }


    // =================================================
    // PATTERN 12 - RADIANT BURST
    // BURST LIÊN TỤC
    // =================================================

    else if(cycle<3600){

        if(frame%18===0){

            let speed=
                2+
                Math.sin(frame*0.03)*0.5;

            for(let i=0;i<40;i++){

                let a=
                    i*Math.PI*2/40+
                    frame*0.02;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(a)*speed,
                    vy:Math.sin(a)*speed,

                    r:4

                });

            }

        }

        if(frame%36===0){

            for(let i=0;i<20;i++){

                let a=
                    i*Math.PI*2/20+
                    Math.PI/20;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(a)*3.5,
                    vy:Math.sin(a)*3.5,

                    r:3

                });

            }

        }

        for(let b of enemyBullets){

            let speed=Math.hypot(b.vx,b.vy);

            if(speed<7){

                b.vx*=1.018;
                b.vy*=1.018;

            }

        }

    }


    // =================================================
    // PATTERN 13 - PURE NEEDLES
    // NEEDLES DÀY
    // =================================================

    else if(cycle<3900){

        if(frame%2===0){

            let a=
                Math.atan2(
                    player.y-boss.y,
                    player.x-boss.x
                );

            for(let i=-3;i<=3;i++){

                let angle=
                    a+
                    i*0.045;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(angle)*6,
                    vy:Math.sin(angle)*6,

                    r:3

                });

            }

        }

        // Needle vòng xoay
        if(frame%16===0){

            let a=frame*0.12;

            for(let i=0;i<12;i++){

                let angle=
                    a+
                    i*Math.PI*2/12;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(angle)*3,
                    vy:Math.sin(angle)*3,

                    r:3

                });

            }

        }

    }


    // =================================================
    // PATTERN 14 - FINAL RADIANCE
    // TỎA NHANH DẦN - CỰC DÀY
    // =================================================

    else if(cycle<4200){

        if(frame%10===0){

            let speed=1.1;

            for(let i=0;i<36;i++){

                let a=
                    frame*0.025+
                    i*Math.PI*2/36;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(a)*speed,
                    vy:Math.sin(a)*speed,

                    r:4

                });

            }

        }

        if(frame%25===0){

            let speed=2.2;

            for(let i=0;i<18;i++){

                let a=
                    -frame*0.035+
                    i*Math.PI*2/18;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(a)*speed,
                    vy:Math.sin(a)*speed,

                    r:3

                });

            }

        }

        for(let b of enemyBullets){

            let speed=Math.hypot(b.vx,b.vy);

            if(speed<8){

                b.vx*=1.035;
                b.vy*=1.035;

            }

        }

    }


    // =================================================
    // PATTERN 15 - PURE WHITE END
    // FINAL - SIÊU DÀY
    // =================================================

    else{

        if(frame%12===0){

            let spin=
                frame*0.025;

            for(let i=0;i<48;i++){

                let a=
                    spin+
                    i*Math.PI*2/48;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(a)*4.5,
                    vy:Math.sin(a)*4.5,

                    r:4

                });

            }

        }

        // Vòng thứ hai lệch góc
        if(frame%24===0){

            let spin=
                -frame*0.035+
                Math.PI/48;

            for(let i=0;i<32;i++){

                let a=
                    spin+
                    i*Math.PI*2/32;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(a)*3.2,
                    vy:Math.sin(a)*3.2,

                    r:3

                });

            }

        }

        // Đạn nhắm player ở final
        if(frame%8===0){

            let a=
                Math.atan2(
                    player.y-boss.y,
                    player.x-boss.x
                );

            for(let i=-1;i<=1;i++){

                let angle=
                    a+i*0.08;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(angle)*5.5,
                    vy:Math.sin(angle)*5.5,

                    r:3

                });

            }

        }

    }

}

}

    // Update enemy
    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

if(skillTimer===0){

e.y+=e.speed;

if(stage>=3){
    e.x+=e.vx||0;
}

}

if(stage===7 || stage===14 || stage===21 || stage===22){
if(frame%20===0 && skillTimer===0){

            let spin=frame*0.15;

            for(let i=0;i<1;i++){

                let a=spin+i*Math.PI/1;

                enemyBullets.push({

                    x:e.x,
                    y:e.y,

                    vx:Math.cos(a)*2,
                    vy:Math.sin(a)*2,

                    r:3

                });

            }

}
}
        // Trúng đạn
        for(let j=bullets.length-1;j>=0;j--){

            let b=bullets[j];

            if(
                Math.abs(b.x-e.x)<e.w/2 &&
                Math.abs(b.y-e.y)<e.h/2
            ){

                e.hp-=player.damage;
                bullets.splice(j,1);

                if(e.hp<=0){
                    score+=100;
                    enemies.splice(i,1);
                }

                break;
            }

        }

        if(i>=enemies.length) continue;

        // Chạm player
        if(
            Math.abs(player.x-e.x)<12 &&
            Math.abs(player.y-e.y)<12
        ){

if(skillTimer===0){
    player.hp--;
}

            enemies.splice(i,1);
            continue;

        }

        // Ra khỏi màn hình
        if(e.y>canvas.height+20){

            enemies.splice(i,1);

        }

    }

    // Enemy bullets
    for(let i=enemyBullets.length-1;i>=0;i--){

        let b=enemyBullets[i];

if(b.ax) b.vx+=b.ax;
if(b.ay) b.vy+=b.ay;

        b.x+=b.vx;
        b.y+=b.vy;
if(b.reflect){

    if((b.x<b.r && b.vx<0) || (b.x>canvas.width-b.r && b.vx>0)){
        b.vx=-b.vx;
        b.reflect--;
    }

    if((b.y<b.r && b.vy<0) || (b.y>canvas.height-b.r && b.vy>0)){
        b.vy=-b.vy;
        b.reflect--;
    }

}
if(b.reflectD){

    // Chỉ phản khi chạm mép dưới
    if(b.y > canvas.height - b.r && b.vy > 0){
        b.vy = -b.vy;
        b.reflectD--;
    }

}
        if(b.orbit){

            b.angle+=0.07;
            b.orbit--;

            b.x=boss.x+Math.cos(b.angle)*70;
            b.y=boss.y+Math.sin(b.angle)*70;

            if(b.orbit===0){

                let ang=Math.atan2(
                    player.y-b.y,
                    player.x-b.x
                );

                b.vx=Math.cos(ang)*4;
                b.vy=Math.sin(ang)*4;

            }

        }
if(b.split){

    if(
        b.x<0 ||
        b.x>canvas.width ||
        b.y<0 ||
        b.y>canvas.height
    ){

        for(let i=0;i<3;i++){

            let a=i*Math.PI*2/3;

            enemyBullets.push({

                x:b.x,
                y:b.y,

                vx:Math.cos(a)*2.8,
                vy:Math.sin(a)*2.8,

                r:5

            });

        }

        enemyBullets.splice(
            enemyBullets.indexOf(b),
            1
        );

    }

}
if(
    Math.hypot(player.x-b.x,player.y-b.y)<b.r+4
){

    if(skillTimer===0){
        player.hp--;
    }

    enemyBullets.splice(i,1);
    continue;

}

        if(
            b.x<-200||
            b.x>canvas.width+200||
            b.y<-200||
            b.y>canvas.height+200
        ){
            enemyBullets.splice(i,1);
        }

    }

    // Effects
    for(let i=effects.length-1;i>=0;i--){

        if(effects[i].update)
            effects[i].update();

        if(effects[i].dead)
            effects.splice(i,1);

    }

    // Items
    for(let i=items.length-1;i>=0;i--){

        items[i].y+=items[i].vy||1;

        if(items[i].y>canvas.height+20)
            items.splice(i,1);

    }
document.getElementById("hud").innerHTML=
`${playableName}<br>
HP: ${player.hp}<br>
LIVES: ${lives}<br>
SKILL CD: ${Math.ceil(skillCooldown/60)}s<br>
SCORE: ${score}<br>
CHAPTER ${chapter}`;
if(player.hp<=0){

    if(lives>0){

        lives--;

        player.hp=5;
        player.x=200;
        player.y=520;

        enemyBullets.length=0;
        enemies.length=0;

    }else{

        gameOver=true;
        alert("GAME OVER");

        return;
    }

}

}

function draw(){

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,canvas.width,canvas.height);
if(boss){
    let img=imgJinrou;

    if(stage===2 || stage===9){
        img=imgMisora;
    }else if(stage===3){
        img=imgElis;
    }else if(stage===4 || stage===11){
        img=imgSeraphel;
    }else if(stage===5){
        img=imgSerial;
    }else if(stage===6){
        img=imgRaizen;
    }else if(stage===7){
        img=imgYuchia;
    }else if(stage===8){
        img=imgRinnie;
    }else if(stage===10){
        img=imgLysette;
    }else if(stage===12){
        img=imgMerivelle;
    }else if(stage===13 || stage===15){
        img=imgMilipsar;
    }else if(stage===14){
        img=imgYumei;
    }else if(stage===16){
        img=imgVelsira;
}else if(stage===17 || stage===21){
    img=imgLunemi;
}else if(stage===18){
    img=imgTsukina;
}else if(stage===19){
    img=imgAurehime;
}else if(stage===20){
    img=imgMirevia;
}else if(stage===22){
    img=imgElyzara;
}

    // =========================================
    // VELSIRA HÓA DƠI Ở PATTERN 3
    // =========================================

    let cycle=frame%540;

    if(stage===16 && cycle>=360){

        ctx.save();

        ctx.translate(boss.x,boss.y);

        // Dơi lớn hơn bình thường
        let s=1.25;

        ctx.scale(s,s);

        // Cánh trái
        ctx.save();

        ctx.scale(-1,1);

        ctx.drawImage(
            img,
            -48,
            -48,
            96,
            96
        );

        ctx.restore();

        // Cánh phải
        ctx.drawImage(
            img,
            -48,
            -48,
            96,
            96
        );

        // Thân dơi
        ctx.beginPath();

        ctx.arc(
            0,
            5,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();

        // Hai tai
        ctx.beginPath();

        ctx.moveTo(-18,-12);
        ctx.lineTo(-28,-38);
        ctx.lineTo(-5,-20);

        ctx.closePath();
        ctx.fill();

        ctx.beginPath();

        ctx.moveTo(18,-12);
        ctx.lineTo(28,-38);
        ctx.lineTo(5,-20);

        ctx.closePath();
        ctx.fill();

        ctx.restore();

    }else{

        // Velsira bình thường
        ctx.drawImage(
            img,
            boss.x-48,
            boss.y-48,
            96,
            96
        );

    }


    // HP Boss
    ctx.fillStyle="red";

    ctx.fillRect(
        40,
        20,
        320,
        10
    );

    ctx.fillStyle="lime";

    ctx.fillRect(
        40,
        20,
        320*(boss.hp/boss.maxHp),
        10
    );

}
ctx.drawImage(
    playableImg,
    player.x-16,
    player.y-16,
    32,
    32
);

ctx.fillStyle="#fff";

for(const e of enemies){

    ctx.fillRect(
        e.x-e.w/2,
        e.y-e.h/2,
        e.w,
        e.h
    );

}

ctx.fillStyle="#00ffff";

for(const b of bullets){

    ctx.fillRect(
        b.x-1,
        b.y-6,
        2,
        8
    );

}
if(skillTimer>0){

    // =================================
    // MERIVELLE - DÂY LEO
    // =================================
    if(playableName==="Merivelle"){

        ctx.strokeStyle="green";
        ctx.lineWidth=3;

        for(const e of enemies){

            for(let i=0;i<5;i++){

                ctx.beginPath();

                ctx.moveTo(
                    e.x,
                    e.y
                );

ctx.lineTo(
    e.x+
    Math.sin(frame*0.12+i)*35,
    e.y+50+i*8
);

                ctx.stroke();

            }

        }

        if(boss){

ctx.strokeStyle="#006400";
            ctx.lineWidth=4;

            for(let i=0;i<8;i++){

                const a=
                    frame*0.08+
                    i*Math.PI/4;

                ctx.beginPath();

                ctx.moveTo(
                    boss.x,
                    boss.y
                );

                ctx.lineTo(
                    boss.x+Math.cos(a)*70,
                    boss.y+Math.sin(a)*70
                );

                ctx.stroke();

            }

        }

    }

    // =================================
    // YUCHIA - LASER
    // =================================
    else if(playableName==="Yuchia"){

        ctx.fillStyle="rgba(0,255,255,.25)";
        ctx.fillRect(
            player.x-18,
            0,
            36,
            player.y
        );

        ctx.fillStyle="#00ffff";
        ctx.fillRect(
            player.x-5,
            0,
            10,
            player.y
        );

        ctx.fillStyle="white";
        ctx.fillRect(
            player.x-2,
            0,
            4,
            player.y
        );

        if(boss){

            ctx.fillStyle="rgba(0,255,255,.25)";
            ctx.fillRect(
                boss.x-25,
                0,
                50,
                boss.y
            );

            ctx.fillStyle="#00ffff";
            ctx.fillRect(
                boss.x-8,
                0,
                16,
                boss.y
            );

        }

    }

    // =================================
    // YUMEI - I WISH...
    // =================================
    else if(playableName==="Yumei"){

        ctx.strokeStyle="#ffffff";
        ctx.lineWidth=2;

        const r=
            (60-skillTimer)*7;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            r,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.fillStyle="#ffffff";
        ctx.font="18px monospace";
        ctx.textAlign="center";

        ctx.fillText(
            "I WISH...",
            canvas.width/2,
            canvas.height/2
        );

    }

    // =================================
    // RENKA - SKILL CŨ
    // =================================
    else{

        // Vòng sóng quanh player
        ctx.strokeStyle="rgba(255,255,255,.8)";
        ctx.lineWidth=2;

        const r=
            Math.max(0,(120-skillTimer)*5);

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            r,
            0,
            Math.PI*2
        );

        ctx.stroke();


        // ==============================
        // ENEMY - HIỆU ỨNG VÀNG
        // ==============================

        ctx.strokeStyle="gold";
        ctx.lineWidth=2;

        for(const e of enemies){

            for(let i=0;i<4;i++){

                const a=
                    frame*0.15+
                    i*Math.PI/2;

                ctx.beginPath();

                ctx.moveTo(
                    e.x+Math.cos(a)*12,
                    e.y+Math.sin(a)*12
                );

                ctx.lineTo(
                    e.x-Math.cos(a)*12,
                    e.y-Math.sin(a)*12
                );

                ctx.stroke();

            }

        }


        // ==============================
        // BOSS - HIỆU ỨNG VÀNG
        // ==============================

        if(boss){

            ctx.strokeStyle="gold";
            ctx.lineWidth=3;

            for(let i=0;i<4;i++){

                const a=
                    frame*0.15+
                    i*Math.PI/2;

                ctx.beginPath();

                ctx.moveTo(
                    boss.x+Math.cos(a)*40,
                    boss.y+Math.sin(a)*40
                );

                ctx.lineTo(
                    boss.x-Math.cos(a)*40,
                    boss.y-Math.sin(a)*40
                );

                ctx.stroke();

            }

        }

    }

}
for (const b of enemyBullets) {
    ctx.fillStyle = b.color || "white";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
}

if(bossNameTimer>0){

    bossNameTimer--;

    ctx.fillStyle="white";
    ctx.font="28px monospace";
    ctx.textAlign="center";
    ctx.fillText(
        bossName,
        canvas.width/2,
        200
    );

}

}

function loop(){

    if(!inMenu && !gameOver){

        update();
        draw();

        frame++;

    }else if(inMenu){

        ctx.fillStyle="#000";
        ctx.fillRect(0,0,canvas.width,canvas.height);

    }

    requestAnimationFrame(loop);
}

document.getElementById("skill").onclick=()=>{

    if(skillCooldown>0) return;

    if(playableName==="Merivelle"){

        skillCooldown=480;
        skillTimer=60;

    }else if(playableName==="Yuchia"){

        skillCooldown=480;
        skillTimer=60;

    }else if(playableName==="Yumei"){

        skillCooldown=240;
        skillTimer=60;

    }else{

        skillCooldown=480;
        skillTimer=120;

    }

};

loop();

</script>
