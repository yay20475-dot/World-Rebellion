<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>World Rebellion</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

body{
    background:#000;
    overflow:hidden;
    font-family:monospace;
}

canvas{
    display:block;
    margin:auto;
    background:#000;
    image-rendering:pixelated;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#hud{
    position:absolute;
    left:8px;
    top:8px;
    color:#fff;
    font-size:16px;
    line-height:20px;
}

#controls{
    position:fixed;
    left:12px;
    bottom:12px;
    width:180px;
    height:180px;
    pointer-events:auto;
}

#controls button,
#skill{
    position:absolute;
    width:56px;
    height:56px;
    font-size:22px;
    border:2px solid #888;
    background:#222;
    color:#fff;
    cursor:pointer;
}

#up{
    left:62px;
    top:0;
}

#left{
    left:0;
    top:62px;
}

#right{
    left:124px;
    top:62px;
}

#down{
    left:62px;
    top:124px;
}

#skill{
    position:fixed;
    right:18px;
    bottom:28px;
    width:90px;
    height:90px;
    font-size:18px;
    pointer-events:auto;
}

button:active{
    transform:translateY(2px);
}

</style>

</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<div id="ui">

<div id="hud"></div>
HP: 5<br>
SCORE: 0<br>
CHAPTER 1
</div>

</div>

<div id="controls">

<button id="up">▲</button>
<button id="left">◀</button>
<button id="right">▶</button>
<button id="down">▼</button>

</div>

<button id="skill">SKILL</button>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

// ===== Images =====

const imgRenka = new Image();
imgRenka.src = "https://i.ibb.co/gbxLFH33/image.png";

const imgJinrou = new Image();
imgJinrou.src = "https://i.ibb.co/Tq7DG4Pz/image.png";

const imgMisora = new Image();
imgMisora.src = "https://i.ibb.co/kZ0tnY9/image.png";

const imgElis = new Image();
imgElis.src = "https://i.ibb.co/ksW1pDq7/image.png";

const imgSeraphel = new Image();
imgSeraphel.src = "https://i.ibb.co/My5X0GqP/image.png";

const imgSerial = new Image();
imgSerial.src = "https://i.ibb.co/GQTB5cL3/image.png";

const imgRaizen = new Image();
imgRaizen.src = "https://i.ibb.co/RGpjLfTZ/image.png";

const imgYuchia = new Image();
imgYuchia.src = "https://i.ibb.co/WvbtsXDp/image.png";

const player={
    x:200,
    y:520,
    w:8,
    h:8,
    speed:3,
    hp:5
};

let playableName="Renka";

let moveUp=false;
let moveDown=false;
let moveLeft=false;
let moveRight=false;

function bindButton(id,key){

    const btn=document.getElementById(id);

    function set(v){
        switch(key){
            case "up": moveUp=v; break;
            case "down": moveDown=v; break;
            case "left": moveLeft=v; break;
            case "right": moveRight=v; break;
        }
    }

    btn.onpointerdown=()=>set(true);

    btn.onpointerup=
    btn.onpointerleave=
    btn.onpointercancel=()=>set(false);

}

bindButton("up","up");
bindButton("down","down");
bindButton("left","left");
bindButton("right","right");

let skillTimer=0;
let skillCooldown=0;

const bullets=[];
const enemies=[];
const enemyBullets=[];
const effects=[];
const items=[];

let stageTimer=0;
let boss=null;
let bossSpawned=false;

let bossNameTimer=0;
let bossName="Jinrou";

let stage = 1;
let bossDefeated = false;
let stage2Timer = 0;

let score=0;
let frame=0;
let chapter=1;

function update(){

if(moveUp) player.y-=player.speed;
if(moveDown) player.y+=player.speed;
if(moveLeft) player.x-=player.speed;
if(moveRight) player.x+=player.speed;

if(skillCooldown>0) skillCooldown--;
if(skillTimer>0) skillTimer--;

if(skillTimer===1){

    enemyBullets.length=0;

    for(let i=enemies.length-1;i>=0;i--){

        enemies[i].hp-=10;

        if(enemies[i].hp<=0){
            score+=100;
            enemies.splice(i,1);
        }

    }

if(boss){

    boss.hp-=10;

if(boss.hp<=0){

    score+=5000;

    enemyBullets.length=0;
    bossName="";
    bossNameTimer=0;

    if(stage===1){
        stage=2;
        stage2Timer=0;
        bossSpawned=false;
    }

    boss=null;
    return;

}

}

}

    player.x=Math.max(16,Math.min(canvas.width-16,player.x));
    player.y=Math.max(16,Math.min(canvas.height-16,player.y));

// Đếm thời gian stage
stageTimer++;

// ===== Stage 1 =====
if(stage===1){

    if(!bossSpawned && stageTimer<60*15){

        if(frame%40===0){

            enemies.push({
                x:Math.random()*(canvas.width-32)+16,
                y:-20,
                w:12,
                h:12,
                hp:2,
                speed:2+Math.random()*1.5
            });

        }

    }

    if(!bossSpawned && stageTimer>=60*15){

        bossSpawned=true;

        boss={
            x:200,
            y:-80,
            hp:300,
            maxHp:300
        };

        bossName="Jinrou";
        bossNameTimer=180;

    }

}

if(stage===2){

    stage2Timer++;

    // Chỉ spawn enemy trước khi Misora xuất hiện
    if(!bossSpawned && frame%20===0){

        enemies.push({
            x:Math.random()*(canvas.width-32)+16,
            y:-20,
            w:12,
            h:12,
            hp:3,
            speed:2.8+Math.random()*1.8
        });

    }

    if(!bossSpawned && stage2Timer>=60*15){

        bossSpawned=true;

        boss={
            x:200,
            y:-80,
            hp:450,
            maxHp:450
        };

        bossName="Misora";
        bossNameTimer=180;

    }

}

if(frame%8===0){

    let shots=1;

    if(score>=4000){
        shots=5;
    }else if(score>=3000){
        shots=4;
   }else if(score>=2000){
        shots=3;
   }else if(score>=1000){
        shots=2;
   }

    if(shots===1){

        bullets.push({
            x:player.x,
            y:player.y-12,
            vx:0,
            vy:-8,
            r:3
        });

    }else{

        for(let i=0;i<shots;i++){

            let spread=(i-(shots-1)/2)*1.2;

            bullets.push({
                x:player.x,
                y:player.y-12,
                vx:spread,
                vy:-8,
                r:3
            });

        }

    }

}

    // Update đạn player
    for(let i=bullets.length-1;i>=0;i--){

        let b=bullets[i];

        b.x+=b.vx;
        b.y+=b.vy;

        if(b.y<-20){
            bullets.splice(i,1);
        }
}
if(boss){

    for(let i=bullets.length-1;i>=0;i--){

        let b=bullets[i];

        if(
            Math.abs(b.x-boss.x)<40 &&
            Math.abs(b.y-boss.y)<40
        ){

            boss.hp--;
            bullets.splice(i,1);

if(boss.hp<=0){

    score+=5000;

    enemyBullets.length=0;
    bossName="";
    bossNameTimer=0;

    if(stage===1){
        stage=2;
        stage2Timer=0;
        bossSpawned=false;
    }

    boss=null;
    return;

}

        }

    }

}
if(boss){

    if(boss.y<100){
        boss.y+=2;
    }

}

// Pattern boss
if(skillTimer===0 && boss){

    // ==========================
    // JINROU
    // ==========================
    if(stage===1){

        let cycle=frame%360;

        if(cycle<120){

            if(frame%20===0){

                for(let i=0;i<18;i++){

                    let a=i*Math.PI*2/18;

                    enemyBullets.push({
                        x:boss.x,
                        y:boss.y,
                        vx:Math.cos(a)*2.5,
                        vy:Math.sin(a)*2.5,
                        r:5
                    });

                }

            }

        }

        else if(cycle<240){

            if(frame%10===0){

                let dx=player.x-boss.x;
                let dy=player.y-boss.y;
                let d=Math.hypot(dx,dy);

                enemyBullets.push({
                    x:boss.x,
                    y:boss.y,
                    vx:dx/d*4,
                    vy:dy/d*4,
                    r:5
                });

            }

        }

        else{

            if(frame%6===0){

                let base=Math.atan2(
                    player.y-boss.y,
                    player.x-boss.x
                );

                for(let i=-3;i<=3;i++){

                    let a=base+i*0.18;

                    enemyBullets.push({
                        x:boss.x,
                        y:boss.y,
                        vx:Math.cos(a)*3,
                        vy:Math.sin(a)*3,
                        r:5
                    });

                }

            }

        }

    }


else if(stage===2){

    let cycle=frame%480;


    // ==========================
    // Đạn Misora
    // ==========================

    if(cycle<160){

        // vòng đạn xoay
        if(frame%45===0){

            let spin=frame*0.08;

            for(let i=0;i<16;i++){

                let a=spin+i*Math.PI*2/16;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(a)*2.5,
                    vy:Math.sin(a)*2.5,

                    r:5

                });

            }

        }

    }


    else if(cycle<320){

        // quạt đạn aim lệch

        if(frame%35===0){

            let base=Math.atan2(
                player.y-boss.y,
                player.x-boss.x
            );


            for(let i=-4;i<=4;i++){

                let a=base+i*0.12;

                enemyBullets.push({

                    x:boss.x,
                    y:boss.y,

                    vx:Math.cos(a)*3.8,
                    vy:Math.sin(a)*3.8,

                    r:5

                });

            }

        }

    }


    else{

        // đạn rơi từ trên xuống

        if(frame%30===0){

            for(let i=0;i<8;i++){

                enemyBullets.push({

                    x:40+i*45,
                    y:-20,

                    vx:(player.x-(40+i*45))*0.01,
                    vy:3.5,

                    r:6

                });

            }

        }

    }



    // ==========================
    // Chém cũ giữ nguyên
    // ==========================


// Chém ngang
if(cycle<160){

    if(frame%50===0){

        let slashY=Math.random()*250+150;

        for(let i=0;i<30;i++){

            enemyBullets.push({

                x:100-i*15,
                y:slashY,

                vx:6,
                vy:0,

                r:6

            });

        }

    }

}


    // Chém chéo từ trên xuống
    else if(cycle<320){

        if(frame%50===0){

            let startY=-50;

            for(let i=0;i<30;i++){

                enemyBullets.push({

                    x:i*15,
                    y:startY+i*15,
                    vx:3.5,
                    vy:3.5,
                    r:6

                });

            }

        }

    }


    // Chém chéo từ dưới lên
    else{

        if(frame%50===0){

            let startY=canvas.height+50;

            for(let i=0;i<30;i++){

                enemyBullets.push({

                    x:i*15,
                    y:startY-i*15,
                    vx:3.5,
                    vy:-3.5,
                    r:6

                });

            }

        }

    }

}

}

    // Update enemy
    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

if(skillTimer===0){
    e.y+=e.speed;
}

        // Trúng đạn
        for(let j=bullets.length-1;j>=0;j--){

            let b=bullets[j];

            if(
                Math.abs(b.x-e.x)<e.w/2 &&
                Math.abs(b.y-e.y)<e.h/2
            ){

                e.hp--;
                bullets.splice(j,1);

                if(e.hp<=0){
                    score+=100;
                    enemies.splice(i,1);
                }

                break;
            }

        }

        if(i>=enemies.length) continue;

        // Chạm player
        if(
            Math.abs(player.x-e.x)<12 &&
            Math.abs(player.y-e.y)<12
        ){

if(skillTimer===0){
    player.hp--;
}

            enemies.splice(i,1);
            continue;

        }

        // Ra khỏi màn hình
        if(e.y>canvas.height+20){

            enemies.splice(i,1);

        }

    }

    // Enemy bullets
    for(let i=enemyBullets.length-1;i>=0;i--){

        let b=enemyBullets[i];

        b.x+=b.vx;
        b.y+=b.vy;

if(
    Math.hypot(player.x-b.x,player.y-b.y)<b.r+4
){

    if(skillTimer===0){
        player.hp--;
    }

    enemyBullets.splice(i,1);
    continue;

}

        if(
            b.x<-200||
            b.x>canvas.width+200||
            b.y<-200||
            b.y>canvas.height+200
        ){
            enemyBullets.splice(i,1);
        }

    }

    // Effects
    for(let i=effects.length-1;i>=0;i--){

        if(effects[i].update)
            effects[i].update();

        if(effects[i].dead)
            effects.splice(i,1);

    }

    // Items
    for(let i=items.length-1;i>=0;i--){

        items[i].y+=items[i].vy||1;

        if(items[i].y>canvas.height+20)
            items.splice(i,1);

    }

document.getElementById("hud").innerHTML=
`${playableName}<br>
HP: ${player.hp}<br>
SCORE: ${score}<br>
CHAPTER ${chapter}`;

if(player.hp<=0){

    cancelAnimationFrame(loopId);

    ctx.fillStyle="rgba(0,0,0,.8)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="red";
    ctx.font="40px monospace";
    ctx.textAlign="center";
    ctx.fillText("GAME OVER",canvas.width/2,canvas.height/2);

    alert("GAME OVER");

    return;

}

}

function draw(){

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.drawImage(
    imgRenka,
    player.x-16,
    player.y-16,
    32,
    32
);

ctx.fillStyle="#fff";

for(const e of enemies){

    ctx.fillRect(
        e.x-e.w/2,
        e.y-e.h/2,
        e.w,
        e.h
    );

}

ctx.fillStyle="#00ffff";

for(const b of bullets){

    ctx.fillRect(
        b.x-1,
        b.y-6,
        2,
        8
    );

}

if(skillTimer>0){

    // Wave tròn
    ctx.strokeStyle="rgba(255,255,255,.8)";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(
        player.x,
        player.y,
        (60-skillTimer)*5,
        0,
        Math.PI*2
    );
    ctx.stroke();

    // Dải vàng quanh enemy
    ctx.strokeStyle="gold";

    for(const e of enemies){

        for(let i=0;i<4;i++){

            const a=frame*0.15+i*Math.PI/2;

            ctx.beginPath();
            ctx.moveTo(
                e.x+Math.cos(a)*12,
                e.y+Math.sin(a)*12
            );
            ctx.lineTo(
                e.x-Math.cos(a)*12,
                e.y-Math.sin(a)*12
            );
            ctx.stroke();

        }

    }

}

if(boss){

    let img=imgJinrou;

    if(stage===2){
        img=imgMisora;
    }

    ctx.drawImage(
        img,
        boss.x-48,
        boss.y-48,
        96,
        96
    );

    // HP Boss
    ctx.fillStyle="red";
    ctx.fillRect(40,20,320,10);

    ctx.fillStyle="lime";
    ctx.fillRect(
        40,
        20,
        320*(boss.hp/boss.maxHp),
        10
    );

}

if(boss){

if(skillTimer>0){

    for(let i=0;i<4;i++){

        const a=frame*0.15+i*Math.PI/2;

        ctx.beginPath();
        ctx.moveTo(
            boss.x+Math.cos(a)*40,
            boss.y+Math.sin(a)*40
        );
        ctx.lineTo(
            boss.x-Math.cos(a)*40,
            boss.y-Math.sin(a)*40
        );
        ctx.stroke();
}
    }

}

ctx.fillStyle="white";

for(const b of enemyBullets){

    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();

}

if(bossNameTimer>0){

    bossNameTimer--;

    ctx.fillStyle="white";
    ctx.font="28px monospace";
    ctx.textAlign="center";
    ctx.fillText(
        bossName,
        canvas.width/2,
        200
    );

}

}

let loopId;

function loop(){

    update();
    draw();

    frame++;

    loopId=requestAnimationFrame(loop);

}

document.getElementById("skill").onclick=()=>{

    if(skillCooldown>0) return;

    skillTimer=60;
    skillCooldown=300;

};

loop();

</script>

</body>
</html>
