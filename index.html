<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>World Rebellion</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

body{
    background:#000;
    overflow:hidden;
    font-family:monospace;
}

canvas{
    display:block;
    margin:auto;
    background:#000;
    image-rendering:pixelated;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#hud{
    position:absolute;
    left:8px;
    top:8px;
    color:#fff;
    font-size:16px;
    line-height:20px;
}

#menu{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
    z-index:1000;
}

#menu h1{
    color:white;
    font-size:34px;
    margin-bottom:30px;
}

#menu button{
    width:220px;
    height:52px;
    font-size:22px;
    border:2px solid #888;
    background:#222;
    color:white;
}

#menu button:disabled{
    background:#111;
    color:#666;
    border-color:#444;
}

.chapter.active{
    border-color:#0ff;
    color:#0ff;
}

#controls{
    position:fixed;
    left:12px;
    bottom:12px;
    width:180px;
    height:180px;
    pointer-events:auto;
}

#controls button,
#skill{
    position:absolute;
    width:56px;
    height:56px;
    font-size:22px;
    border:2px solid #888;
    background:#222;
    color:#fff;
    cursor:pointer;
}

#up{
    left:62px;
    top:0;
}

#left{
    left:0;
    top:62px;
}

#right{
    left:124px;
    top:62px;
}

#down{
    left:62px;
    top:124px;
}

#skill{
    position:fixed;
    right:18px;
    bottom:28px;
    width:90px;
    height:90px;
    font-size:18px;
    pointer-events:auto;
}

button:active{
    transform:translateY(2px);
}

</style>

</head>

        b.y-6,
        2,
