<title>World Rebellion</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

body{
    background:#000;
    overflow:hidden;
    font-family:monospace;
}

canvas{
    display:block;
    margin:auto;
    background:#000;
    image-rendering:pixelated;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#hud{
    position:absolute;
    left:8px;
    top:8px;
    color:#fff;
    font-size:16px;
    line-height:20px;
}

#menu{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
    z-index:1000;
}

#menu h1{
    color:white;
    font-size:34px;
    margin-bottom:30px;
}

#menu button{
    width:220px;
    height:52px;
    font-size:22px;
    border:2px solid #888;
    background:#222;
    color:white;
}

#menu button:disabled{
    background:#111;
    color:#666;
    border-color:#444;
}

.chapter.active{
    border-color:#0ff;
    color:#0ff;
}
#chapterSelect{
    display:flex;
    flex-direction:column;
    gap:18px;
}
#characterSelect{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.character{
    width:220px;
    height:42px;
    font-size:18px;
}

.character.active{
    border-color:#0ff;
    color:#0ff;
}

.character:disabled{
    background:#111;
    color:#555;
    border-color:#333;
}
#characterList{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
}

#characterList .character{
    display:block;
    width:200px;
    margin:5px auto;
}
#controls{
    position:fixed;
    left:12px;
    bottom:12px;
    width:180px;
    height:180px;
    pointer-events:auto;
}

#controls button,
#skill{
    position:absolute;
    width:56px;
    height:56px;
    font-size:22px;
    border:2px solid #888;
    background:#222;
    color:#fff;
    cursor:pointer;
    opacity:0.45;
}
#skillCd{
    position:fixed;
    right:18px;
    bottom:125px;
    width:90px;
    text-align:center;
    color:#0ff;
    font-size:14px;
    font-weight:bold;
    text-shadow:0 0 4px #000;
    pointer-events:none;
}
#up{
    left:62px;
    top:0;
}

#left{
    left:0;
    top:62px;
}

#right{
    left:124px;
    top:62px;
}

#down{
    left:62px;
    top:124px;
}

#skill{
    position:fixed;
    right:18px;
    bottom:28px;
    width:90px;
    height:90px;
    font-size:18px;
    pointer-events:auto;
}

button:active{
    transform:translateY(2px);
}

</style>

</head>

let moveUp=false;

let moveLeft=false;
let moveRight=false;

function bindButton(id,key){

    const btn=document.getElementById(id);

    function set(v){
        switch(key){
            case "up": moveUp=v; break;
            case "down": moveDown=v; break;
            case "left": moveLeft=v; break;
            case "right": moveRight=v; break;
        }
    }

    btn.onpointerdown=()=>set(true);

    btn.onpointerup=
    btn.onpointerleave=
    btn.onpointercancel=()=>set(false);

}

}
// =================================
// MILIPSAR - SAO RƠI
// =================================
else if(playableName==="Milipsar"){

    ctx.strokeStyle="#88ccff";
    ctx.lineWidth=2;

    // Hàm vẽ sao 5 cánh
    function drawStar(x,y,r){

        ctx.beginPath();

        for(let i=0;i<10;i++){

            const a=
                -Math.PI/2+
                i*Math.PI/5;

            const rr=
                i%2===0 ? r : r*0.42;

            const px=
                x+Math.cos(a)*rr;

            const py=
                y+Math.sin(a)*rr;

            if(i===0)
                ctx.moveTo(px,py);
            else
                ctx.lineTo(px,py);
        }

        ctx.closePath();
        ctx.stroke();
    }


    // Sao rơi từ trên trời
    for(let i=0;i<12;i++){

        let x=
            (i*37+
            frame*2)%canvas.width;

    // Sao rơi quanh boss

            let sx=

                Math.sin(frame*0.08+i*1.7)*100;

}
    // =================================
    // MERIVELLE - DÂY LEO
    // =================================
    else if(playableName==="Merivelle"){

ctx.lineTo(

ctx.strokeStyle="#006400";

// =============================================
// RINNIE - MIRROR

else if(playableName==="Rinnie"){

    // =================================

// =================================

else if(playableName==="Lunemi"){

else if(playableName==="Tsukina"){

// =================================

else if(playableName==="Kaleya"){

    // =================================

        player.x<canvas.width/2

        cloneX-16,
        cloneY-16,
        32,
        32
    );


    // =================================
    // HÀM VẼ CÂY NĂNG LƯỢNG
    // =================================

    function drawEnergyTree(x,y){

        let grow=
            Math.min(
                1,
                (120-skillTimer)/60
            );

        let height=
            30+
            grow*170;

        let sway=
            Math.sin(frame*0.08)*8;


        // -----------------------------
        // AURA
        // -----------------------------

        ctx.globalAlpha=0.22;

        ctx.strokeStyle="#55ff88";
        ctx.lineWidth=8;

        ctx.beginPath();

        ctx.arc(
            x,
            y-height*0.45,
            35+grow*25,
            0,
            Math.PI*2
        );

        ctx.stroke();


        // -----------------------------
        // THÂN CÂY
        // -----------------------------

        ctx.globalAlpha=0.9;

        ctx.strokeStyle="#66ff99";
        ctx.lineWidth=6;

        ctx.beginPath();

        ctx.moveTo(
            x,
            y+8
        );

        ctx.quadraticCurveTo(
            x+sway,
            y-height*0.45,
            x-sway,
            y-height
        );

        ctx.stroke();


        // -----------------------------
        // CÀNH LỚN
        // -----------------------------

        for(let i=0;i<6;i++){

            let side=
                i%2===0
                ?-1
                :1;

            let yy=
                y-height*(0.25+i*0.11);

            let len=
                25+
                grow*35;

            ctx.strokeStyle="#66ff99";
            ctx.lineWidth=4;

            ctx.beginPath();

            ctx.moveTo(
                x,
                yy
            );

            ctx.quadraticCurveTo(
                x+side*15,
                yy-15,
                x+side*len,
                yy-35
            );

            ctx.stroke();


            // -------------------------
            // LÁ NĂNG LƯỢNG
            // -------------------------

            ctx.fillStyle="#9affb8";

            for(let j=0;j<3;j++){

                let lx=
                    x+
                    side*
                    (
                        len*(j+1)/4
                    );

                let ly=
                    yy-
                    35*(j+1)/3;

                ctx.beginPath();

                ctx.ellipse(
                    lx,
                    ly,
                    9,
                    5,
                    side*0.5,
                    0,
                    Math.PI*2
                );

                ctx.fill();
            }

        }


        // -----------------------------
        // NĂNG LƯỢNG BAY RA
        // -----------------------------

        for(let i=0;i<10;i++){

            let a=
                frame*0.04+
                i*Math.PI*2/10;

            let r=
                20+
                (
                    (frame*2+i*23)%80
                );

            let px=
                x+
                Math.cos(a)*r;

            let py=
                y-height*0.55+
                Math.sin(a)*r*0.5;

            ctx.globalAlpha=0.7;

            ctx.fillStyle="#aaffc0";

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                2,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    // =================================
    // CÂY CỦA PLAYER
    // =================================

    drawEnergyTree(
        player.x,
        player.y
    );


    // =================================
    // CÂY CỦA CLONE
    // =================================

    drawEnergyTree(
        cloneX,
        cloneY
    );


    // =================================
    // ĐƯỜNG NĂNG LƯỢNG NỐI 2 BÊN
    // =================================

    ctx.globalAlpha=0.5;

    ctx.strokeStyle="#77ffaa";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y
    );

    ctx.lineTo(
        cloneX,
        cloneY
    );

    ctx.stroke();


    ctx.restore();
}

}
for(const b of enemyBullets){

    // Mỗi viên đạn có alpha riêng

    ctx.beginPath();

    ctx.arc(

        b.y,
        b.r,

    );

    ctx.restore();

}
if(bossNameTimer>0){

if(cycle>=600){

        let x=

        ctx.fillStyle="#000";

        ctx.fillText(

        );

        ctx.fillStyle="#fff";

        ctx.fillText(
            "WARNING",

        );
    }

    ctx.restore();
}
}

function loop(){

    if(!inMenu && !gameOver){

        update();
        draw();

        frame++;

    }else if(inMenu){

        ctx.fillStyle="#000";
        ctx.fillRect(0,0,canvas.width,canvas.height);

    }

    requestAnimationFrame(loop);
}
